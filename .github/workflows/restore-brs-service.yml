name: Restore BRS service
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore and remove one-time workflow
        run: |
          git checkout fb1690f82bc7681385986df1c6b5546747fbf6d8 -- backend/services/brs.service.cjs
          git rm .github/workflows/restore-brs-service.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/services/brs.service.cjs
          git commit -m "fix: restore full BRS market service"
          git push
