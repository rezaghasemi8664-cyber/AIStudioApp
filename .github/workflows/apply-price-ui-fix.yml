name: Apply stock analysis price UI fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, 'closing percent repair commit')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch closing and live percentages
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('src/components/StockAnalysis.tsx')
          text = path.read_text(encoding='utf-8-sig')

          pattern = re.compile(
              r'(const closingPriceChangePercent = pickFirstNumber\()(.*?)(\n\s*\);\n\n\s*const lastPriceChangePercent = pickFirstNumber\()(.*?)(\n\s*\);)',
              re.S,
          )
          m = pattern.search(text)
          if not m:
              raise SystemExit('percentage blocks not found')

          closing_block = m.group(2)
          closing_block = re.sub(r'\n\s*(?:marketData|lastHistoryRecord|source)\.priceChangePercent,?', '', closing_block)
          closing_block = re.sub(r'\n\s*mergedMetrics\?\.priceChangePercent,?', '', closing_block)
          closing_block = re.sub(r'\n\s*\(mergedMetrics as any\)\?\.priceChangePercent,?', '', closing_block)
          if '(mergedMetrics as any)?.closeChangePercent' not in closing_block:
              closing_block = closing_block.rstrip() + '\n    (mergedMetrics as any)?.closeChangePercent,\n'

          live_block = m.group(4)
          if '(mergedMetrics as any)?.priceChangePercent' not in live_block:
              live_block = live_block.rstrip() + '\n    (mergedMetrics as any)?.priceChangePercent,\n'

          text = (
              text[:m.start(2)] + closing_block + text[m.end(2):m.start(4)]
              + live_block + text[m.end(4):]
          )
          path.write_text(text, encoding='utf-8-sig')
          print('Mapped closeChangePercent -> closing UI and priceChangePercent -> live UI.')

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Commit repaired source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/StockAnalysis.tsx
          git diff --cached --quiet && { echo 'No source change'; exit 0; }
          git commit -m 'fix: closing percent repair commit'
          git push
