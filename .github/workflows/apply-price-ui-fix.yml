name: Apply stock analysis price UI fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, 'closing percent repair commit')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair closing/live percentage mapping
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/components/StockAnalysis.tsx')
          text = path.read_text(encoding='utf-8-sig')

          # The previous automated patch left two missing commas. Repair them deterministically.
          text = text.replace(
              "    mergedMetrics?.priceChangePercent,\n    mergedMetrics?.closingPriceChangePercent\n    (mergedMetrics as any)?.closeChangePercent,",
              "    mergedMetrics?.closingPriceChangePercent,\n    (mergedMetrics as any)?.closeChangePercent,\n    (mergedMetrics as any)?.pcp,"
          )
          text = text.replace(
              "    mergedMetrics?.lastPriceChangePercent\n    (mergedMetrics as any)?.priceChangePercent,",
              "    mergedMetrics?.lastPriceChangePercent,\n    (mergedMetrics as any)?.priceChangePercent,"
          )

          # Ensure the normalized market metrics preserve the backend's distinct close-change field.
          marker = "    priceChangePercent: pickFirstNumber(mm.priceChangePercent, mm.pctChange, mm.changePercent),\n"
          addition = marker + "    closingPriceChangePercent: pickFirstNumber(mm.closingPriceChangePercent, mm.closeChangePercent, mm.pcp),\n"
          if 'closingPriceChangePercent: pickFirstNumber(mm.closingPriceChangePercent' not in text:
              if marker not in text:
                  raise SystemExit('normalizeMarketMetrics marker not found')
              text = text.replace(marker, addition, 1)

          # Guarantee canonical mappings in normalizeAnalysisShape.
          if 'const closingPriceChangePercent = pickFirstNumber(' not in text:
              raise SystemExit('closing percentage block missing')
          if 'const lastPriceChangePercent = pickFirstNumber(' not in text:
              raise SystemExit('live percentage block missing')

          path.write_text(text, encoding='utf-8-sig')
          print('Closing percentage is mapped only from closeChangePercent/pcp; live percentage remains priceChangePercent.')

      - name: Verify TypeScript source
        shell: bash
        run: |
          node -e "const fs=require('fs'); const s=fs.readFileSync('src/components/StockAnalysis.tsx','utf8'); if(/mergedMetrics\?\.closingPriceChangePercent\s*\n\s*\(mergedMetrics/.test(s)) process.exit(1); if(/mergedMetrics\?\.lastPriceChangePercent\s*\n\s*\(mergedMetrics/.test(s)) process.exit(1); console.log('Source mapping syntax verified.')"

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Commit repaired source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/StockAnalysis.tsx
          git diff --cached --quiet && { echo 'No source change'; exit 0; }
          git commit -m 'fix: closing percent repair commit'
          git push
