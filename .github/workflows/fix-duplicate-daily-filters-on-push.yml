name: Normalize Daily Filters Navigation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove duplicate daily filters tabs
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('src/App.tsx')
          text = path.read_text(encoding='utf-8')

          pattern = re.compile(
              r'\n\s*<TabButton\n'
              r'\s*tab="dailyFilters"\n'
              r'\s*label="فیلترهای روزانه"\n'
              r'\s*icon=\{<PresentationChartLineIcon />\}\n'
              r'\s*alertType="none"\n'
              r'\s*locked=\{isExpired\}\n'
              r'\s*activeTab=\{activeTab\}\n'
              r'\s*onTabClick=\{handleTabClick\}\n'
              r'\s*/>',
              re.MULTILINE,
          )

          matches = list(pattern.finditer(text))
          if len(matches) <= 1:
              print(f'dailyFilters occurrences: {len(matches)}; nothing to change')
              raise SystemExit(0)

          first = matches[0].group(0)
          rebuilt = text[:matches[0].start()] + first + text[matches[0].end():]
          # Remove every duplicate occurrence after the first, using the same exact block.
          rebuilt = pattern.sub(lambda m: '' if m.group(0) != first else m.group(0), rebuilt, count=0)
          # The substitution above can be affected by formatting identity; enforce by indexed removal.
          matches2 = list(pattern.finditer(rebuilt))
          if len(matches2) > 1:
              chunks = []
              last = 0
              for m in matches2[1:]:
                  chunks.append(rebuilt[last:m.start()])
                  last = m.end()
              chunks.append(rebuilt[last:])
              rebuilt = ''.join(chunks)

          path.write_text(rebuilt, encoding='utf-8')
          remaining = len(list(pattern.finditer(rebuilt)))
          print(f'dailyFilters occurrences after normalization: {remaining}')
          if remaining != 1:
              raise SystemExit('Normalization failed: expected exactly one dailyFilters TabButton')

      - name: Commit normalization and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-duplicate-daily-filters-on-push.yml
          if git diff --quiet -- src/App.tsx .github/workflows/fix-duplicate-daily-filters-on-push.yml; then
            echo "No source change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx .github/workflows/fix-duplicate-daily-filters-on-push.yml
          git commit -m "fix: keep one daily filters navigation tab"
          git push
