name: Fix daily persisted market summary UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-daily-market-summary-ui.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch source files
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('src/services/marketSummaryService.ts')
          s = p.read_text(encoding='utf-8-sig')
          pattern = re.compile(r"export const getLatestSummary = async \(\): Promise<MarketSummaryData \| null> => \{.*?\n\};", re.S)
          replacement = '''export const getLatestSummary = async (): Promise<MarketSummaryData | null> => {
  // آخرین خلاصه UI فقط از آخرین رکورد ذخیره‌شده روزانه خوانده می‌شود.
  const history = await getSummaryHistory(1, 1);
  return history?.data?.[0] ?? null;
};'''
          s, count = pattern.subn(replacement, s, count=1)
          if count != 1: raise SystemExit('getLatestSummary target not found')
          p.write_text(s, encoding='utf-8')

          p = Path('backend/services/marketSummary.service.cjs')
          s = p.read_text(encoding='utf-8-sig')
          old = '    id: record.id,\n    date: toDateOnlyISO(record.summaryDate),'
          new = '    id: record.id,\n    createdAt: record.createdAt ? new Date(record.createdAt).toISOString() : null,\n    date: toDateOnlyISO(record.summaryDate),'
          if old not in s: raise SystemExit('normalizeSummaryRecord target not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

      - name: Commit source files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/marketSummaryService.ts backend/services/marketSummary.service.cjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: use persisted daily market summary instead of live snapshot"
          git push origin main

# trigger source patch