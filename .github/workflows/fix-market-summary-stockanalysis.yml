name: Fix StockAnalysis market summary latest source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-market-summary-stockanalysis.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch remaining TypeScript errors
        shell: python
        run: |
          from pathlib import Path

          # MarketSummaryDashboard: keep toneFromValue's neutral value compatible
          # with StatusBadge/KpiCard instead of asserting an invalid default tone.
          p = Path('src/components/MarketSummaryDashboard.tsx')
          s = p.read_text(encoding='utf-8-sig')
          s = s.replace(
              "const currentTone = tone ?? toneFromValue(value) as 'info' | 'warning' | 'default' | 'positive' | 'negative';",
              "const currentTone: 'positive' | 'negative' | 'warning' | 'neutral' | 'info' = tone ?? toneFromValue(value);",
          )
          s = s.replace(
              "const regimeTone = toneFromValue(r.state) as 'info' | 'warning' | 'default' | 'positive' | 'negative';",
              "const regimeTone: 'info' | 'warning' | 'neutral' | 'positive' | 'negative' = toneFromValue(r.state);",
          )
          s = s.replace(
              "tone={toneFromValue(l.label) as 'info' | 'warning' | 'default' | 'positive' | 'negative'}",
              "tone={toneFromValue(l.label)}",
          )
          s = s.replace(
              "tone={toneFromValue(f.state) as 'info' | 'warning' | 'default' | 'positive' | 'negative'}",
              "tone={toneFromValue(f.state)}",
          )
          s = s.replace(
              "tone={toneFromValue(m.state) as 'info' | 'warning' | 'default' | 'positive' | 'negative'}",
              "tone={toneFromValue(m.state)}",
          )
          s = s.replace(
              "tone={toneFromValue(risk.state) as 'info' | 'warning' | 'default' | 'positive' | 'negative'}",
              "tone={toneFromValue(risk.state)}",
          )
          s = s.replace(
              "tone={toneFromValue(actionBias) as 'info' | 'warning' | 'default' | 'positive' | 'negative'}",
              "tone={toneFromValue(actionBias)}",
          )
          s = s.replace(
              "tone={toneFromValue(action.risk) as 'info' | 'warning' | 'default' | 'positive' | 'negative'}",
              "tone={toneFromValue(action.risk)}",
          )
          p.write_text(s, encoding='utf-8')

          # StockAnalysis: normalize nullable breakdown values, use the supported
          # MarketIcon prop, and stop reading a non-existent history item summary.
          p = Path('src/components/StockAnalysis.tsx')
          s = p.read_text(encoding='utf-8-sig')
          s = s.replace(
              "return { inflow, outflow, net };",
              "return { inflow: inflow ?? 0, outflow: outflow ?? 0, net: net ?? 0 };",
          )
          s = s.replace('<MarketIcon className="h-4 w-4" />', '<MarketIcon size={16} />')
          s = s.replace(
              "item.result?.summary ??\n                        item.summary ??\n                        'تحلیل ذخیره شده'",
              "item.result?.summary ?? 'تحلیل ذخیره شده'",
          )
          p.write_text(s, encoding='utf-8')

          # adminService already normalizes create/update passwords to a required string.
          p = Path('src/services/adminService.ts')
          s = p.read_text(encoding='utf-8-sig')
          s = s.replace("password: normalizeString(payload.password),", "password: normalizeString(payload.password) || '',")
          p.write_text(s, encoding='utf-8')
          print('Targeted TypeScript fixes applied')

      - name: Verify typecheck and frontend build
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Commit frontend fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/MarketSummaryDashboard.tsx src/components/StockAnalysis.tsx src/services/adminService.ts
          if git diff --cached --quiet; then
            echo "No source changes"
            exit 0
          fi
          git commit -m "fix: resolve remaining TypeScript errors"
          git push origin main
