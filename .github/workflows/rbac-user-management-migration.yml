name: RBAC user management migration
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Switch admin panel to RBAC user management
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/components/AdminPanel.tsx')
          s=p.read_text(encoding='utf-8-sig')
          old="import UserManagementLegacy from './UserManagementLegacy';"
          new="import UserManagementLegacy from './UserManagementRBAC';"
          if old not in s:
              raise SystemExit('expected import not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/AdminPanel.tsx
          git commit -m "feat(admin): use RBAC user management UI" || exit 0
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/rbac-user-management-migration.yml || true
          git commit -m "chore: remove temporary RBAC migration workflow" || true
          git push || true
