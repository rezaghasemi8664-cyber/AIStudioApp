name: Fix market summary UI final

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch canonical latest market summary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/components/MarketSummaryDashboard.tsx')
          s = p.read_text(encoding='utf-8-sig')

          if "const [fetchedContent, setFetchedContent]" not in s:
              needle = "  const [fetching, setFetching] = useState(false);"
              replacement = needle + "\n\n  const [fetchedContent, setFetchedContent] = useState<string | null>(null);"
              s = s.replace(needle, replacement, 1)

          s = s.replace("    if (suppliedIntelligence || loading) return;", "    if (loading) return;", 1)

          old = """          setFetchedIntelligence(\n            summary?.marketIntelligence ?? null\n          );"""
          new = """          setFetchedIntelligence(\n            summary?.marketIntelligence ?? null\n          );\n          setFetchedContent(\n            summary?.content ?? summary?.summary ?? null\n          );"""
          s = s.replace(old, new, 1)

          old = """  const intelligence =\n    suppliedIntelligence ?? fetchedIntelligence;\n\n  if (loading || fetching) {"""
          new = """  const intelligence =\n    suppliedIntelligence ?? fetchedIntelligence;\n\n  // The latest endpoint is the canonical source. Never let a stale\n  // marketIntelligence object override the current Persian summary text.\n  const canonicalContent = fetchedContent ?? content ?? null;\n\n  if (loading || fetching) {"""
          s = s.replace(old, new, 1)

          old = """  if (!intelligence) {\n    return ("""
          new = """  if (canonicalContent) {\n    return (\n      <div\n        dir=\"rtl\"\n        className=\"rounded-[20px] border border-white/10 bg-slate-950/70 p-6\"\n        style={{ fontFamily: 'Vazirmatn, IRANSans, Tahoma, Arial, sans-serif' }}\n      >\n        <div className=\"text-[18px] font-extrabold text-white\">خلاصه بازار</div>\n        <div className=\"mt-4 whitespace-pre-wrap rounded-2xl border border-white/[0.07] bg-white/[0.025] p-5 text-[15px] leading-[2] text-slate-200\">\n          {canonicalContent}\n        </div>\n      </div>\n    );\n  }\n\n  if (!intelligence) {\n    return ("""
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit frontend repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/MarketSummaryDashboard.tsx
          if git diff --cached --quiet; then echo 'No frontend repair needed'; exit 0; fi
          git commit -m 'fix: use canonical latest market summary text'
          git push origin main
