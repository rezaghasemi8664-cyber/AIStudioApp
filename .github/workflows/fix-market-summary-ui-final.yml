name: Fix market summary UI final

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch frontend
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/components/MarketSummaryDashboard.tsx')
          s = p.read_text(encoding='utf-8-sig')

          if "const [fetchedContent, setFetchedContent]" not in s:
              s = s.replace(
                  "  const [fetching, setFetching] = useState(false);",
                  "  const [fetching, setFetching] = useState(false);\n\n  const [fetchedContent, setFetchedContent] = useState<string | null>(null);",
                  1,
              )

          if "setFetchedContent(" not in s:
              marker = "          setFetchedIntelligence(\n            summary?.marketIntelligence ?? null\n          );"
              s = s.replace(
                  marker,
                  marker + "\n          setFetchedContent(summary?.content ?? summary?.summary ?? null);",
                  1,
              )

          s = re.sub(
              r"const canonicalContent =\s*content \|\| null;",
              "const canonicalContent = fetchedContent ?? content ?? null;",
              s,
              count=1,
          )

          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify
        shell: bash
        run: |
          grep -n "fetchedContent" src/components/MarketSummaryDashboard.tsx
          grep -n "const canonicalContent = fetchedContent" src/components/MarketSummaryDashboard.tsx

      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/MarketSummaryDashboard.tsx
          if git diff --cached --quiet; then echo 'No frontend changes'; exit 0; fi
          git commit -m 'fix: prefer canonical latest market summary content'
          git push origin main
