name: Fix market summary UI final

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch canonical latest market summary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/components/MarketSummaryDashboard.tsx')
          s = p.read_text(encoding='utf-8-sig')

          if "const [fetchedContent, setFetchedContent]" not in s:
              s = s.replace(
                  "  const [fetching, setFetching] = useState(false);",
                  "  const [fetching, setFetching] = useState(false);\n\n  const [fetchedContent, setFetchedContent] = useState<string | null>(null);",
                  1,
              )

          if "summary?.content ?? summary?.summary" not in s:
              s = s.replace(
                  "          setFetchedIntelligence(\n            summary?.marketIntelligence ?? null\n          );",
                  "          setFetchedIntelligence(\n            summary?.marketIntelligence ?? null\n          );\n          setFetchedContent(\n            summary?.content ?? summary?.summary ?? null\n          );",
                  1,
              )

          s = s.replace(
              "  const canonicalContent =\n    content || null;",
              "  // Latest API content is canonical and must override stale parent/intelligence text.\n  const canonicalContent =\n    fetchedContent ?? content ?? null;",
              1,
          )

          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate source
        shell: bash
        run: |
          grep -n "fetchedContent" src/components/MarketSummaryDashboard.tsx
          grep -n "canonicalContent" src/components/MarketSummaryDashboard.tsx

      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/MarketSummaryDashboard.tsx
          if git diff --cached --quiet; then echo 'No frontend repair needed'; exit 0; fi
          git commit -m 'fix: use fetched latest market summary content'
          git push origin main
