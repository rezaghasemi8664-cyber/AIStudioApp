name: Fix remaining TypeScript errors

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch sources
        shell: python
        run: |
          from pathlib import Path
          import re

          def patch(path, fn):
              p = Path(path)
              s = p.read_text(encoding='utf-8-sig')
              n = fn(s)
              if n == s:
                  raise SystemExit(f'No change made to {path}')
              p.write_text(n, encoding='utf-8')

          def app(s):
              old = "setTseLinks(uiConfigService.getLinksForDisplay());"
              new = "setTseLinks(uiConfigService.getLinksForDisplay().map((link) => ({ id: link.id, label: link.label ?? link.title, href: link.href ?? link.url })));"
              if old not in s:
                  raise SystemExit('App TseLink assignment not found')
              return s.replace(old, new, 1)

          def market(s):
              s = s.replace("${valueColor[tone]}", "${valueColor[tone ?? 'default']}", 1)
              s = s.replace("tone={regimeTone}", "tone={regimeTone === 'default' ? 'neutral' : regimeTone}", 1)
              return s

          def stock(s):
              s = s.replace("{ inflow, outflow, net }", "{ inflow: inflow ?? 0, outflow: outflow ?? 0, net: net ?? 0 }", 0)
              s = re.sub(r"\{item\.result\?\.summary \?\?\s*item\.summary \?\?\s*'تحلیل ذخیره شده'\}", "{item.result?.summary ?? 'تحلیل ذخیره شده'}", s, count=1)
              return s

          patch('src/App.tsx', app)
          patch('src/components/MarketSummaryDashboard.tsx', market)
          patch('src/components/StockAnalysis.tsx', stock)

          p = Path('src/services/adminService.ts')
          s = p.read_text(encoding='utf-8-sig')
          s2 = s.replace("password: normalizeString(payload.password) || '',", "password: normalizeString(payload.password) ?? '',", 1)
          if s2 == s:
              raise SystemExit('adminService password assignment not found')
          p.write_text(s2, encoding='utf-8')

      - name: Typecheck
        run: |
          npm ci
          npm run typecheck

      - name: Build
        run: npm run build

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/MarketSummaryDashboard.tsx src/components/StockAnalysis.tsx src/services/adminService.ts
          git commit -m "fix: resolve remaining TypeScript errors"
          git push origin main
