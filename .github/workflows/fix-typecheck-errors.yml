name: Fix remaining TypeScript errors

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch sources
        shell: python
        run: |
          from pathlib import Path
          import re

          def patch(path, fn):
              p = Path(path)
              s = p.read_text(encoding='utf-8-sig')
              n = fn(s)
              if n != s:
                  p.write_text(n, encoding='utf-8')
                  print(f'patched {path}')
              else:
                  print(f'no change needed: {path}')

          def app(s):
              old = "setTseLinks(uiConfigService.getLinksForDisplay());"
              new = "setTseLinks(uiConfigService.getLinksForDisplay().map((link) => ({ id: link.id, label: link.label ?? link.title, href: link.href ?? link.url })));"
              return s.replace(old, new, 1)

          def market(s):
              s = s.replace("${valueColor[tone]}", "${valueColor[tone ?? 'default']}", 1)
              s = s.replace("tone={regimeTone}", "tone={regimeTone === 'default' ? 'neutral' : regimeTone}", 1)
              return s

          def stock(s):
              s = re.sub(r"\{item\.result\?\.summary \?\?\s*item\.summary \?\?\s*'تحلیل ذخیره شده'\}", "{item.result?.summary ?? 'تحلیل ذخیره شده'}", s, count=1)
              return s

          def admin(s):
              return s.replace("password: normalizeString(payload.password) || '',", "password: normalizeString(payload.password) ?? '',", 1)

          patch('src/App.tsx', app)
          patch('src/components/MarketSummaryDashboard.tsx', market)
          patch('src/components/StockAnalysis.tsx', stock)
          patch('src/services/adminService.ts', admin)

      - name: Typecheck
        run: |
          npm ci
          npm run typecheck

      - name: Build
        run: npm run build

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/MarketSummaryDashboard.tsx src/components/StockAnalysis.tsx src/services/adminService.ts
          if git diff --cached --quiet; then
            echo "No source changes"
            exit 0
          fi
          git commit -m "fix: resolve remaining TypeScript errors"
          git push origin main
