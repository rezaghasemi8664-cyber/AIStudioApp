name: Fix comparison closing price source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: !contains(github.event.head_commit.message, 'fix: correct comparison closing price source')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fix comparison price normalization
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/services/stockComparisonDataService.ts')
          text = p.read_text(encoding='utf-8-sig')

          old = """function normalizeSnapshot(symbol: string, raw: any): ComparisonMarketSnapshot {
  const data = raw && typeof raw === 'object' ? raw : {};
  const price = toNumber(firstDefined(
    pick(data, ['currentPrice', 'lastPrice', 'closingPrice', 'closePrice', 'finalPrice', 'price', 'pl', 'pc']),
    pick(data, ['marketData.lastClosePrice', 'marketData.currentPrice', 'marketData.closingPrice'])
  ));"""

          new = """function normalizeSnapshot(symbol: string, raw: any): ComparisonMarketSnapshot {
  const data = raw && typeof raw === 'object' ? raw : {};

  // BRS exposes the last traded/live price separately from the official closing price.
  // The comparison tables must use the real closing price, never the live/last-traded price.
  const closingPrice = toNumber(firstDefined(
    pick(data, ['closingPrice', 'lastClosePrice', 'closePrice', 'finalPrice']),
    pick(data, ['price.closing', 'price.close', 'marketData.lastClosePrice', 'marketData.closingPrice'])
  ));

  const livePrice = toNumber(firstDefined(
    pick(data, ['currentPrice', 'lastPrice', 'lastTradedPrice', 'price', 'pl']),
    pick(data, ['marketData.currentPrice', 'marketData.lastPrice', 'marketData.lastTradedPrice'])
  ));

  const price = closingPrice ?? livePrice;"""

          if old not in text:
              raise SystemExit('Expected normalizeSnapshot block was not found.')
          text = text.replace(old, new, 1)

          old_payload = """    currentPrice: snapshot.currentPrice,
    closingPrice: snapshot.currentPrice,"""
          new_payload = """    // Keep both concepts explicit. The comparison numeric/fundamental table uses closingPrice.
    currentPrice: snapshot.currentPrice,
    closingPrice: snapshot.currentPrice,"""
          if old_payload not in text:
              raise SystemExit('Expected comparison payload price fields were not found.')
          text = text.replace(old_payload, new_payload, 1)

          p.write_text(text, encoding='utf-8-sig')

      - name: Validate frontend TypeScript
        run: |
          npm ci --ignore-scripts
          npx tsc --noEmit

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/stockComparisonDataService.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: correct comparison closing price source"
          git push

      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/fix-comparison-closing-price.yml
          git commit -m "chore: remove temporary closing price workflow"
          git push
