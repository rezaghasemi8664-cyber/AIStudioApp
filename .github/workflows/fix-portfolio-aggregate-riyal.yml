name: Fix Portfolio Aggregate Rial Summary

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix aggregated portfolio accounting units to Rial
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/services/gapgptService.ts')
          s = p.read_text(encoding='utf-8')
          old = s

          # The portfolio accounting values are calculated from entry/current
          # prices already stored in Rial. Only the unit label was incorrect.
          s = s.replace(' تومان', ' ریال')

          if s == old:
              raise SystemExit('No تومان unit label found in gapgptService.ts; refusing a no-op commit.')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/gapgptService.ts
          git commit -m "Fix portfolio aggregate accounting units to Rial" || exit 0
          git push
