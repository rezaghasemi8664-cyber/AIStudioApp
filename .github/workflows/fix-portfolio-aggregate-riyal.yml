name: Fix Portfolio Aggregate Rial Summary

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix aggregated portfolio accounting units to Rial
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/services/gapgptService.ts')
          s = p.read_text(encoding='utf-8')

          replacements = {
              'میانگین قیمت خرید: ${formatMoney(item.averageEntryPrice)} تومان': 'میانگین قیمت خرید: ${formatMoney(item.averageEntryPrice)} ریال',
              'قیمت فعلی: ${formatMoney(item.currentPrice)} تومان | ارزش فعلی: ${formatMoney(item.currentValue)} تومان': 'قیمت فعلی: ${formatMoney(item.currentPrice)} ریال | ارزش فعلی: ${formatMoney(item.currentValue)} ریال',
              'مبلغ سود/زیان: ${item.pnl >= 0 ? \' + \' : \'\'}${formatMoney(item.pnl)} تومان | درصد سود/زیان: ${formatPercent(item.pnlPercent)}': 'مبلغ سود/زیان: ${item.pnl >= 0 ? \' + \' : \'\'}${formatMoney(item.pnl)} ریال | درصد سود/زیان: ${formatPercent(item.pnlPercent)}',
          }

          original = s
          for old, new in replacements.items():
              s = s.replace(old, new)

          if s == original:
              raise SystemExit('Expected portfolio aggregate تومان labels were not found; refusing to create a no-op commit.')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/gapgptService.ts .github/workflows/fix-portfolio-aggregate-riyal.yml
          git commit -m "Fix portfolio aggregate accounting units to Rial" || exit 0
          git push
