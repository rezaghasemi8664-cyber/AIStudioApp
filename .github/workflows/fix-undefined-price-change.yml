name: Fix undefined priceChangePercent

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix stale runtime reference
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/components/StockAnalysis.tsx')
          s = p.read_text(encoding='utf-8-sig')
          old = s
          # The local canonical variables are lastPriceChangePercent and closingPriceChangePercent.
          # Fix only the stale debug-log/object shorthand that references the removed local variable.
          s = s.replace("        priceChangePercent,\n        pe,", "        lastPriceChangePercent,\n        pe,")
          s = s.replace("        priceChangePercent,\n        eps,", "        lastPriceChangePercent,\n        eps,")
          # Also handle the exact debug block indentation currently used in the file.
          s = s.replace("        priceChangePercent,\n        pe,\n        eps,", "        lastPriceChangePercent,\n        pe,\n        eps,")
          if s == old:
            raise SystemExit('No stale reference pattern found; refusing to create a no-op commit.')
          p.write_text(s, encoding='utf-8')
          import subprocess
          subprocess.run(['git','config','user.name','github-actions[bot]'], check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git','add','src/components/StockAnalysis.tsx'], check=True)
          subprocess.run(['git','commit','-m','fix: remove stale priceChangePercent reference'], check=True)
          subprocess.run(['git','push'], check=True)
          Path('.github/workflows/fix-undefined-price-change.yml').unlink()
          subprocess.run(['git','add','.github/workflows/fix-undefined-price-change.yml'], check=True)
          subprocess.run(['git','commit','-m','chore: remove temporary price fix workflow'], check=True)
          subprocess.run(['git','push'], check=True)
