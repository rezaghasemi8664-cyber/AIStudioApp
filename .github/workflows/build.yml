name: Build

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'ci/**'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Patch AI features to use backend
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: python
        run: |
          from pathlib import Path
          import re

          gap = Path('src/services/gapgptService.ts')
          text = gap.read_text(encoding='utf-8-sig')

          analyze = r'''export const analyzeStock = async (
  symbol: string,
  dailyCount = 30,
  weeklyCount = 24,
  featureKey: FeatureKey = 'analysis'
): Promise<AnalysisResult> => {
  const response = await appApiFetch<any>('/analyze/stock', {
    method: 'POST',
    body: JSON.stringify({
      symbol,
      dailyCount,
      weeklyCount,
      analysisType: featureKey,
      featureKey,
    }),
  });

  const payload = response?.data ?? response;
  const analysis = payload?.data && typeof payload.data === 'object' ? payload.data : payload;

  if (!analysis || typeof analysis !== 'object') {
    throw new Error('پاسخ معتبر از سرویس تحلیل سهم دریافت نشد.');
  }

  return {
    ...analysis,
    symbol,
    currentPrice: Number(analysis.currentPrice ?? analysis.closingPrice ?? analysis.marketData?.lastClosePrice ?? 0),
    analysisDate: analysis.analysisDate || new Date().toISOString(),
  } as AnalysisResult;
};'''

          pattern = re.compile(r"export const analyzeStock = async \([\s\S]*?\n\};\n\n/\* ==============================\n   .*?Scalping", re.M)
          m = pattern.search(text)
          if not m:
              raise SystemExit('analyzeStock block not found')
          text = text[:m.start()] + analyze + "\n\n/* ==============================\n   ?? Scalping" + text[m.end():]

          portfolio = r'''export const getPortfolioOptimization = async (
  portfolio: PortfolioItem[],
  analyses: (AnalysisResult | undefined)[]
): Promise<PortfolioOptimizationResult> => {
  if (!Array.isArray(portfolio) || portfolio.length === 0) {
    throw new Error('سبد سرمایه‌گذاری خالی است.');
  }

  const response = await appApiFetch<any>('/ai/portfolio-optimize', {
    method: 'POST',
    body: JSON.stringify({ portfolio, analyses }),
  });

  const payload = response?.data ?? response;
  const result = payload?.data && typeof payload.data === 'object' ? payload.data : payload;

  if (!result || typeof result !== 'object') {
    throw new Error('پاسخ معتبر از سرویس بهینه‌سازی سبد دریافت نشد.');
  }

  return result as PortfolioOptimizationResult;
};'''

          pattern = re.compile(r"export const getPortfolioOptimization = async \([\s\S]*?\n\};\n\n/\* ==============================\n   .*?Compare", re.M)
          m = pattern.search(text)
          if not m:
              raise SystemExit('getPortfolioOptimization block not found')
          text = text[:m.start()] + portfolio + "\n\n/* ==============================\n   ?? ?????? ????" + text[m.end():]

          gap.write_text(text, encoding='utf-8')

          routes = Path('backend/routes/ai.routes.cjs')
          r = routes.read_text(encoding='utf-8-sig')
          if "require('../services/ai.service.cjs')" not in r:
              r = r.replace("const axios = require('axios');", "const axios = require('axios');\nconst aiService = require('../services/ai.service.cjs');")

          endpoint = r'''\n// --- POST /api/ai/portfolio-optimize - Backend-first portfolio optimization ---\nrouter.post('/portfolio-optimize', authenticate, async function (req, res) {\n  try {\n    const portfolio = req.body && (req.body.portfolio || req.body.items);\n    const analyses = req.body && Array.isArray(req.body.analyses) ? req.body.analyses : [];\n\n    const result = await aiService.optimizePortfolio({\n      portfolio: Array.isArray(portfolio) ? portfolio : [],\n      analyses,\n      userId: req.user && req.user.id,\n    });\n\n    return res.json({\n      success: true,\n      data: result && result.data ? result.data : result,\n      source: 'backend-gapgpt',\n    });\n  } catch (error) {\n    console.error('[AI] POST /portfolio-optimize error:', error.message);\n    return res.status(error.message === 'سبد سرمایه‌گذاری خالی است' ? 400 : 502).json({\n      success: false,\n      message: error.message || 'خطا در تحلیل و بهینه‌سازی سبد',\n      code: 'PORTFOLIO_AI_FAILED',\n    });\n  }\n});\n'''
          if "router.post('/portfolio-optimize'" not in r:
              r = r.replace("\nmodule.exports = router;", endpoint + "\nmodule.exports = router;")
          routes.write_text(r, encoding='utf-8')

      - name: Commit backend-first AI changes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/gapgptService.ts backend/routes/ai.routes.cjs
          git diff --cached --quiet || git commit -m "fix(ai): backend-first stock and portfolio analysis"
          git push || true

      - name: Build frontend
        run: npm run build
