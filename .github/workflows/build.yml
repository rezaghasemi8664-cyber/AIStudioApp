name: Build

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'ci/**'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply one-time closing price percentage fix
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess

          path = Path('src/components/StockAnalysis.tsx')
          text = path.read_text(encoding='utf-8-sig')

          if 'const calculatedClosingPriceChangePercent' not in text:
              pattern = re.compile(
                  r"    const closingPriceChangePercent = pickFirstNumber\(.*?\n    \);\n    const lastPriceChangePercent = pickFirstNumber\(",
                  re.S,
              )

              replacement = '''    const previousClosingPrice = pickFirstNumber(
      md?.previousClosingPrice,
      (md as any)?.previousClosePrice,
      (md as any)?.yesterdayPrice,
      (md as any)?.priceYesterday,
      (md as any)?.pYstClPr,
      mm?.previousClosingPrice,
      (mm as any)?.previousClosePrice,
      (mm as any)?.yesterdayPrice,
      (mm as any)?.priceYesterday,
      (mm as any)?.pYstClPr,
      rawMarketData?.previousClosingPrice,
      rawMarketData?.previousClosePrice,
      rawMarketData?.yesterdayPrice,
      rawMarketData?.priceYesterday,
      rawMarketData?.pYstClPr,
      rawPayload?.previousClosingPrice,
      rawPayload?.previousClosePrice,
      rawPayload?.yesterdayPrice,
      rawPayload?.priceYesterday,
      rawPayload?.pYstClPr,
      raw?.previousClosingPrice,
      raw?.previousClosePrice,
      raw?.yesterdayPrice,
      raw?.priceYesterday,
      raw?.pYstClPr
    );

    const calculatedClosingPriceChangePercent =
      closingPrice !== null && previousClosingPrice !== null && previousClosingPrice !== 0
        ? ((closingPrice - previousClosingPrice) / previousClosingPrice) * 100
        : null;

    const closingPriceChangePercent = pickFirstNumber(
      md?.closingPriceChangePercent,
      (md as any)?.closeChangePercent,
      (md as any)?.pcp,
      mm?.closingPriceChangePercent,
      (mm as any)?.closeChangePercent,
      (mm as any)?.pcp,
      rawMarketData?.closingPriceChangePercent,
      rawMarketData?.closeChangePercent,
      rawMarketData?.pcp,
      rawPayload?.closingPriceChangePercent,
      rawPayload?.closeChangePercent,
      rawPayload?.pcp,
      raw?.closingPriceChangePercent,
      raw?.closeChangePercent,
      raw?.pcp,
      calculatedClosingPriceChangePercent
    );

    const lastPriceChangePercent = pickFirstNumber('''

              new_text, count = pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise SystemExit('Expected closingPriceChangePercent block was not found')
              path.write_text(new_text, encoding='utf-8')

          # Remove the temporary workflow; this patch is intentionally one-time.
          temporary_workflow = Path('.github/workflows/apply-closing-price-percent-fix.yml')
          if temporary_workflow.exists():
              temporary_workflow.unlink()

          changed = subprocess.run(['git', 'status', '--porcelain'], capture_output=True, text=True, check=True).stdout.strip()
          if changed:
              subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
              subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
              subprocess.run(['git', 'add', 'src/components/StockAnalysis.tsx', '.github/workflows/apply-closing-price-percent-fix.yml'], check=True)
              subprocess.run(['git', 'commit', '-m', 'fix: separate closing and last price change percentages'], check=True)
              subprocess.run(['git', 'push'], check=True)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
