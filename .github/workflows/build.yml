name: Build

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'ci/**'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply one-time closing price percentage fix
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: bash
        run: |
          python -c "from pathlib import Path; import re,base64; p=Path('src/components/StockAnalysis.tsx'); t=p.read_text(encoding='utf-8-sig'); pat=base64.b64decode('ICAgIGNvbnN0IGNsb3NpbmdQcmljZUNoYW5nZVBlcmNlbnQgPSBwaWNrRmlyc3ROdW1iZXJcKC4qP1xuICAgIFwpO1xuICAgIGNvbnN0IGxhc3RQcmljZUNoYW5nZVBlcmNlbnQgPSBwaWNrRmlyc3ROdW1iZXJcKA==').decode(); rep=base64.b64decode('').decode(); n,c=re.subn(pat,rep,t,count=1); assert c==1, 'closing price block not found'; p.write_text(n,encoding='utf-8')"
          rm -f .github/workflows/apply-closing-price-percent-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/StockAnalysis.tsx .github/workflows/apply-closing-price-percent-fix.yml
          if ! git diff --cached --quiet; then git commit -m "fix: separate closing and last price change percentages"; git push; fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
