name: Build

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'ci/**'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Apply one-time closing price percentage fix
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = 'src/components/StockAnalysis.tsx';

            const file = await github.rest.repos.getContent({ owner, repo, path, ref: 'main' });
            const sha = file.data.sha;
            const current = Buffer.from(file.data.content, 'base64').toString('utf8');

            if (!current.includes('const calculatedClosingPriceChangePercent')) {
              const pattern = /    const closingPriceChangePercent = pickFirstNumber\(.*?\n    \);\n    const lastPriceChangePercent = pickFirstNumber\(/s;
              const replacement = `    const previousClosingPrice = pickFirstNumber(
      md?.previousClosingPrice,
      (md as any)?.previousClosePrice,
      (md as any)?.yesterdayPrice,
      (md as any)?.priceYesterday,
      (md as any)?.pYstClPr,
      mm?.previousClosingPrice,
      (mm as any)?.previousClosePrice,
      (mm as any)?.yesterdayPrice,
      (mm as any)?.priceYesterday,
      (mm as any)?.pYstClPr,
      rawMarketData?.previousClosingPrice,
      rawMarketData?.previousClosePrice,
      rawMarketData?.yesterdayPrice,
      rawMarketData?.priceYesterday,
      rawMarketData?.pYstClPr,
      rawPayload?.previousClosingPrice,
      rawPayload?.previousClosePrice,
      rawPayload?.yesterdayPrice,
      rawPayload?.priceYesterday,
      rawPayload?.pYstClPr,
      raw?.previousClosingPrice,
      raw?.previousClosePrice,
      raw?.yesterdayPrice,
      raw?.priceYesterday,
      raw?.pYstClPr
    );

    const calculatedClosingPriceChangePercent =
      closingPrice !== null && previousClosingPrice !== null && previousClosingPrice !== 0
        ? ((closingPrice - previousClosingPrice) / previousClosingPrice) * 100
        : null;

    const closingPriceChangePercent = pickFirstNumber(
      md?.closingPriceChangePercent,
      (md as any)?.closeChangePercent,
      (md as any)?.pcp,
      mm?.closingPriceChangePercent,
      (mm as any)?.closeChangePercent,
      (mm as any)?.pcp,
      rawMarketData?.closingPriceChangePercent,
      rawMarketData?.closeChangePercent,
      rawMarketData?.pcp,
      rawPayload?.closingPriceChangePercent,
      rawPayload?.closeChangePercent,
      rawPayload?.pcp,
      raw?.closingPriceChangePercent,
      raw?.closeChangePercent,
      raw?.pcp,
      calculatedClosingPriceChangePercent
    );

    const lastPriceChangePercent = pickFirstNumber(`;

              const updated = current.replace(pattern, replacement);
              if (updated === current) {
                core.setFailed('Expected closing price percentage block was not found');
                return;
              }

              await github.rest.repos.createOrUpdateFileContents({
                owner,
                repo,
                path,
                message: 'fix: separate closing and last price change percentages',
                content: Buffer.from(updated, 'utf8').toString('base64'),
                sha,
                branch: 'main',
              });
            }

            const temporaryPath = '.github/workflows/apply-closing-price-percent-fix.yml';
            try {
              const temp = await github.rest.repos.getContent({ owner, repo, path: temporaryPath, ref: 'main' });
              await github.rest.repos.deleteFile({
                owner,
                repo,
                path: temporaryPath,
                message: 'chore: remove temporary closing price fix workflow',
                sha: temp.data.sha,
                branch: 'main',
              });
            } catch (error) {
              if (error.status !== 404) throw error;
            }

      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
