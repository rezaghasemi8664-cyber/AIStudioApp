name: Build

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'ci/**'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply canonical market metrics correction
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          def patch(path, pairs):
              p=Path(path); s=p.read_text(encoding='utf-8-sig'); old=s
              for a,b in pairs: s=s.replace(a,b,1)
              if s!=old: p.write_text(s,encoding='utf-8-sig'); return True
              return False
          changed=False
          changed |= patch('backend/services/brs.service.cjs', [
            ("  var realBuyVolume = nz(toInt(raw.Buy_I_Volume), 0);\n  var realSellVolume = nz(toInt(raw.Sell_I_Volume), 0);\n  var instBuyVolume = nz(toInt(raw.Buy_N_Volume), 0);\n  var instSellVolume = nz(toInt(raw.Sell_N_Volume), 0);",
             "  var realBuyVolume = nz(toInt(raw.Buy_I_Volume), 0);\n  var realSellVolume = nz(toInt(raw.Sell_I_Volume), 0);\n  var instBuyVolume = nz(toInt(raw.Buy_N_Volume), 0);\n  var instSellVolume = nz(toInt(raw.Sell_N_Volume), 0);\n  var realBuyValue = toNumber(raw.Buy_I_Value != null ? raw.Buy_I_Value : raw.buy_I_Value);\n  var realSellValue = toNumber(raw.Sell_I_Value != null ? raw.Sell_I_Value : raw.sell_I_Value);\n  var instBuyValue = toNumber(raw.Buy_N_Value != null ? raw.Buy_N_Value : raw.buy_N_Value);\n  var instSellValue = toNumber(raw.Sell_N_Value != null ? raw.Sell_N_Value : raw.sell_N_Value);"),
            ("  var tradeVolume = toInt(raw.tvol != null ? raw.tvol : raw.volume);\n  var tradeValue = toNumber(raw.tval != null ? raw.tval : raw.value);\n  var avgPrice = tradeValue != null && tradeVolume != null && tradeVolume > 0 ? tradeValue / tradeVolume : null;",
             "  var tradeVolume = toInt(raw.tvol != null ? raw.tvol : (raw.qTotTran5J != null ? raw.qTotTran5J : raw.volume));\n  var tradeValue = toNumber(raw.qTotCap != null ? raw.qTotCap : (raw.tval != null ? raw.tval : raw.value));\n  var yesterdayPrice = toNumber(raw.py != null ? raw.py : raw.yesterday);\n  var lastChangePercent = toNumber(raw.plp != null ? raw.plp : raw.lastChangePercent);\n  if (lastChangePercent == null && priceLast != null && yesterdayPrice != null && yesterdayPrice !== 0) lastChangePercent = Number((((priceLast - yesterdayPrice) / yesterdayPrice) * 100).toFixed(2));\n  var closeChangePercent = toNumber(raw.pcp != null ? raw.pcp : raw.closeChangePercent);\n  if (closeChangePercent == null && priceClose != null && yesterdayPrice != null && yesterdayPrice !== 0) closeChangePercent = Number((((priceClose - yesterdayPrice) / yesterdayPrice) * 100).toFixed(2));\n  var avgPrice = tradeValue != null && tradeVolume != null && tradeVolume > 0 ? tradeValue / tradeVolume : null;"),
            ("      lastChangePercent: toNumber(raw.plp != null ? raw.plp : raw.lastChangePercent),\n      closing: priceClose,\n      closingChange: toNumber(raw.pcc != null ? raw.pcc : raw.closeChange),\n      closingChangePercent: toNumber(raw.pcp != null ? raw.pcp : raw.closeChangePercent),\n      yesterday: toNumber(raw.py != null ? raw.py : raw.yesterday),",
             "      lastChangePercent: lastChangePercent,\n      closing: priceClose,\n      closingChange: toNumber(raw.pcc != null ? raw.pcc : raw.closeChange),\n      closingChangePercent: closeChangePercent,\n      yesterday: yesterdayPrice,"),
            ("      real: {\n        buyVolume: realBuyVolume,\n        sellVolume: realSellVolume,",
             "      real: {\n        buyVolume: realBuyVolume,\n        sellVolume: realSellVolume,\n        buyValue: realBuyValue,\n        sellValue: realSellValue,\n        netValue: realBuyValue != null && realSellValue != null ? realBuyValue - realSellValue : null,"),
            ("        netCount: realBuyCount - realSellCount,\n        net: realBuyVolume - realSellVolume", "        netCount: realBuyCount - realSellCount,\n        net: realBuyValue != null && realSellValue != null ? realBuyValue - realSellValue : null"),
            ("      institutional: {\n        buyVolume: instBuyVolume,\n        sellVolume: instSellVolume,", "      institutional: {\n        buyVolume: instBuyVolume,\n        sellVolume: instSellVolume,\n        buyValue: instBuyValue,\n        sellValue: instSellValue,\n        netValue: instBuyValue != null && instSellValue != null ? instBuyValue - instSellValue : null,"),
            ("        netCount: instBuyCount - instSellCount,\n        net: instBuyVolume - instSellVolume\n      },\n      legal:", "        netCount: instBuyCount - instSellCount,\n        net: instBuyValue != null && instSellValue != null ? instBuyValue - instSellValue : null\n      },\n      legal:"),
            ("      legal: {\n        buyVolume: instBuyVolume,\n        sellVolume: instSellVolume,", "      legal: {\n        buyVolume: instBuyVolume,\n        sellVolume: instSellVolume,\n        buyValue: instBuyValue,\n        sellValue: instSellValue,\n        netValue: instBuyValue != null && instSellValue != null ? instBuyValue - instSellValue : null,"),
            ("        netCount: instBuyCount - instSellCount,\n        net: instBuyVolume - instSellVolume\n      }", "        netCount: instBuyCount - instSellCount,\n        net: instBuyValue != null && instSellValue != null ? instBuyValue - instSellValue : null\n      }"),
            ("  result.realBuyVolume = realBuyVolume;\n  result.realSellVolume = realSellVolume;\n  result.instBuyVolume = instBuyVolume;\n  result.instSellVolume = instSellVolume;\n  result.realMoneyFlow = realBuyVolume - realSellVolume;\n  result.legalMoneyFlow = instBuyVolume - instSellVolume;\n  result.instMoneyFlow = instBuyVolume - instSellVolume;",
             "  result.realBuyVolume = realBuyVolume;\n  result.realSellVolume = realSellVolume;\n  result.instBuyVolume = instBuyVolume;\n  result.instSellVolume = instSellVolume;\n  result.realBuyValue = realBuyValue;\n  result.realSellValue = realSellValue;\n  result.instBuyValue = instBuyValue;\n  result.instSellValue = instSellValue;\n  result.realMoneyFlow = realBuyValue != null && realSellValue != null ? realBuyValue - realSellValue : null;\n  result.legalMoneyFlow = instBuyValue != null && instSellValue != null ? instBuyValue - instSellValue : null;\n  result.instMoneyFlow = instBuyValue != null && instSellValue != null ? instBuyValue - instSellValue : null;"),
            ("  result.tradeCount = result.trading.count;", "  result.tradeCount = result.trading.count;\n  result.priceChangePercent = result.price.lastChangePercent;\n  result.closeChangePercent = result.price.closingChangePercent;")
          ])
          changed |= patch('src/components/StockAnalysis.tsx', [
            ("const volume = toNum(getPropByAliases(item, ['volume', 'vol', 'zTotTran', 'qTotTran5J', 'qTotTran']));", "const volume = toNum(getPropByAliases(item, ['volume', 'vol', 'qTotTran5J', 'qTotTran']));"),
            ("getPropByAliases(item, ['value', 'tradedValue', 'tradeValue', 'marketValue', 'qTotCap', 'tval', 'qTotTran5J'])", "getPropByAliases(item, ['value', 'tradedValue', 'tradeValue', 'qTotCap', 'tval'])"),
            ("    lastHistoryRecord.priceChangePercent, lastHistoryRecord.changePercent, lastHistoryRecord.priceChange, lastHistoryRecord.change, lastHistoryRecord.chp,\n    mergedMetrics?.priceChangePercent, source.priceChangePercent, source.changePercent, source.priceChange, source.change, source.chp", "    lastHistoryRecord.priceChangePercent, lastHistoryRecord.changePercent,\n    mergedMetrics?.priceChangePercent, source.priceChangePercent, source.changePercent"),
            ("    marketData.tradedVolume, marketData.volume, marketData.vol, marketData.zTotTran, marketData.qTotTran5J,\n    lastHistoryRecord.tradedVolume, lastHistoryRecord.volume, lastHistoryRecord.vol, lastHistoryRecord.zTotTran, lastHistoryRecord.qTotTran5J,\n    source.tradedVolume, source.volume, source.vol, source.zTotTran, source.qTotTran5J", "    marketData.tradedVolume, marketData.volume, marketData.vol, marketData.qTotTran5J,\n    lastHistoryRecord.tradedVolume, lastHistoryRecord.volume, lastHistoryRecord.vol, lastHistoryRecord.qTotTran5J,\n    source.tradedVolume, source.volume, source.vol, source.qTotTran5J"),
            ("marketData.tradedValue, marketData.tradeValue, marketData.value, marketData.qTotCap, marketData.tval, marketData.qTotTran5J,", "marketData.tradedValue, marketData.tradeValue, marketData.value, marketData.qTotCap, marketData.tval,")
          ])
          wf=Path('.github/workflows/fix-market-metrics.yml')
          if wf.exists(): wf.unlink(); changed=True
          subprocess.run(['node','--check','backend/services/brs.service.cjs'],check=True)
          subprocess.run(['git','diff','--check'],check=True)
          if changed:
              subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
              subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
              subprocess.run(['git','add','backend/services/brs.service.cjs','src/components/StockAnalysis.tsx','.github/workflows/build.yml','.github/workflows/fix-market-metrics.yml'],check=True)
              subprocess.run(['git','commit','-m','fix: canonicalize symbol market metrics'],check=True)
              subprocess.run(['git','push'],check=True)
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
