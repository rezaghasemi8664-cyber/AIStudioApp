name: Fix market summary history content once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, 'fix: preserve stored market summary history content')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch history endpoint
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('backend/controllers/marketSummary.controller.cjs')
          text = path.read_text(encoding='utf-8-sig')
          old = "data:await enrichMany(result.data||[])"
          new = "data:result.data||[]"
          if old not in text:
              raise SystemExit('Target history enrichment call not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/controllers/marketSummary.controller.cjs
          git rm .github/workflows/fix-market-summary-history-content-once.yml
          git commit -m 'fix: preserve stored market summary history content'
          git push
