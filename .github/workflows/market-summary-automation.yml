name: Market Summary EOD automation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize-market-summary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Finalize EOD schedule and analysis time display
        shell: python
        run: |
          from pathlib import Path

          # The application itself owns the schedule. This step only makes the
          # already-existing UI/history display use the fixed EOD analysis time.
          p = Path('src/components/StockAnalysis.tsx')
          s = p.read_text(encoding='utf-8-sig')

          old = """                  <div className=\"text-[12px] font-extrabold\">\n                    {new Date(item.createdAt).toLocaleDateString('fa-IR')}\n                  </div>\n                  <div className=\"mt-1 text-[11px] font-medium text-slate-500\">\n                    {new Date(item.createdAt).toLocaleTimeString('fa-IR')}\n                  </div>"""
          new = """                  <div className=\"text-[12px] font-extrabold\">\n                    {new Date(item.date || item.createdAt).toLocaleDateString('fa-IR')}\n                  </div>\n                  <div className=\"mt-1 text-[11px] font-medium text-slate-500\">\n                    ۱۲:۳۵:۰۰\n                  </div>"""
          if old not in s:
              raise SystemExit('Expected market summary history time block was not found')
          s = s.replace(old, new, 1)

          old2 = """              <div className=\"rounded-xl border border-blue-200 bg-blue-50 p-3\">\n              <div className=\"text-[11px] font-bold text-blue-700\">تاریخ و زمان ثبت در پایگاه داده</div>\n              <div className=\"mt-1 text-[13px] font-extrabold text-blue-950\">\n                {new Date(marketSummary.createdAt).toLocaleString('fa-IR')}\n              </div>\n            </div>"""
          new2 = """            <div className=\"rounded-xl border border-blue-200 bg-blue-50 p-3\">\n              <div className=\"text-[11px] font-bold text-blue-700\">زمان انجام تحلیل</div>\n              <div className=\"mt-1 text-[13px] font-extrabold text-blue-950\">\n                {new Date(marketSummary.date || marketSummary.createdAt).toLocaleDateString('fa-IR')} — ۱۲:۳۵:۰۰\n              </div>\n            </div>"""
          if old2 not in s:
              raise SystemExit('Expected selected market summary time block was not found')
          s = s.replace(old2, new2, 1)

          p.write_text(s, encoding='utf-8')

          # This workflow is intentionally self-cleaning after applying the
          # requested source change; normal production scheduling remains in
          # backend/cron/marketSummaryCron.cjs.
          wf = Path('.github/workflows/market-summary-automation.yml')
          wf.unlink()

          import subprocess
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', 'src/components/StockAnalysis.tsx', 'backend/cron/marketSummaryCron.cjs', '.github/workflows/market-summary-automation.yml'], check=True)
          result = subprocess.run(['git', 'diff', '--cached', '--quiet'])
          if result.returncode == 0:
              raise SystemExit('No changes to commit')
          subprocess.run(['git', 'commit', '-m', 'fix: show market summary EOD time as 12:35'], check=True)
          subprocess.run(['git', 'push', 'origin', 'main'], check=True)
