name: Apply watchlist UI import

on:
  push:
    paths:
      - 'src/services/watchlistService.ts'
      - 'src/components/PortfolioWatchlists.tsx'
      - 'src/components/PortfolioEnhanced.tsx'
      - 'backend/routes/watchlist.routes.cjs'

permissions:
  contents: write

jobs:
  patch-import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Replace Portfolio lazy import
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/App.tsx')
          text = path.read_text(encoding='utf-8-sig')
          old = "const Portfolio = lazy(() => import('./components/Portfolio'));"
          new = "const Portfolio = lazy(() => import('./components/PortfolioEnhanced'));"
          if old not in text:
              raise SystemExit('Portfolio import pattern not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Commit App import
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          if git diff --cached --quiet; then
            echo "No App.tsx change required"
            exit 0
          fi
          git commit -m "feat: connect portfolio watchlist UI"
          git push
