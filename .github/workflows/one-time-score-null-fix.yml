name: One-time analysis score null fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[score-null-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch score fallbacks
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/components/StockAnalysis.tsx')
          text = path.read_text(encoding='utf-8-sig')

          replacements = {
              "fundamentalScore: clamp(scores.fundamentalScore ?? source.fundamentalScore ?? scores.fundamental ?? source.fundamental, 0, 100, 0),": "fundamentalScore: (() => {\n        const value = scores.fundamentalScore ?? source.fundamentalScore ?? scores.fundamental ?? source.fundamental;\n        return value === null || value === undefined || value === '' ? null : clamp(value, 0, 100, 0);\n      })(),",
              "technicalScore: clamp(scores.technicalScore ?? source.technicalScore ?? scores.technical ?? source.technical, 0, 100, 0),": "technicalScore: (() => {\n        const value = scores.technicalScore ?? source.technicalScore ?? scores.technical ?? source.technical;\n        return value === null || value === undefined || value === '' ? null : clamp(value, 0, 100, 0);\n      })(),",
              "fundamentalScore: analysisData.scores?.fundamentalScore ?? 0,": "fundamentalScore: analysisData.scores?.fundamentalScore ?? null,",
              "technicalScore: analysisData.scores?.technicalScore ?? 0,": "technicalScore: analysisData.scores?.technicalScore ?? null,",
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing expected text: {old}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8-sig')

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/StockAnalysis.tsx
          git commit -m "fix: preserve unavailable analysis scores as null [score-null-fix]"
          git push
