name: Fix closing price change percent

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, 'separate closing and last price percentages')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/components/StockAnalysis.tsx')
          text = path.read_text(encoding='utf-8-sig')

          marker = 'const closingPriceChangePercent = pickFirstNumber('
          start = text.find(marker)
          if start < 0: raise SystemExit('first closing percentage block not found')
          end = text.find('\n  const lastPriceChangePercent = pickFirstNumber(', start)
          if end < 0: raise SystemExit('first last percentage block not found')
          block = '''const closingPriceChangePercent = pickFirstNumber(\n    marketData.closingPriceChangePercent,\n    marketData.closeChangePercent,\n    marketData.pcp,\n    lastHistoryRecord.closingPriceChangePercent,\n    lastHistoryRecord.closeChangePercent,\n    lastHistoryRecord.pcp,\n    source.closingPriceChangePercent,\n    source.closeChangePercent,\n    source.pcp,\n    mergedMetrics?.closingPriceChangePercent\n  );\n'''
          text = text[:start] + block + text[end:]

          marker = '    const closingPriceChangePercent = pickFirstNumber('
          start = text.find(marker)
          if start < 0: raise SystemExit('resolved closing percentage block not found')
          end = text.find('\n    const lastPriceChangePercent = pickFirstNumber(', start)
          if end < 0: raise SystemExit('resolved last percentage block not found')
          block = '''    const closingPriceChangePercent = pickFirstNumber(\n      md?.closingPriceChangePercent,\n      (md as any)?.closeChangePercent,\n      (md as any)?.pcp,\n      mm?.closingPriceChangePercent,\n      rawMarketData?.closingPriceChangePercent,\n      rawMarketData?.closeChangePercent,\n      rawMarketData?.pcp,\n      rawPayload?.closingPriceChangePercent,\n      rawPayload?.closeChangePercent,\n      rawPayload?.pcp,\n      raw?.closingPriceChangePercent,\n      raw?.closeChangePercent,\n      raw?.pcp\n    );\n'''
          text = text[:start] + block + text[end:]
          path.write_text(text, encoding='utf-8-sig')

      - name: Verify
        shell: python
        run: |
          from pathlib import Path
          text = Path('src/components/StockAnalysis.tsx').read_text(encoding='utf-8-sig')
          starts = []
          pos = 0
          while True:
            pos = text.find('const closingPriceChangePercent = pickFirstNumber(', pos)
            if pos < 0: break
            starts.append(pos); pos += 1
          if len(starts) < 2: raise SystemExit('expected two closing percentage blocks')
          for s in starts[:2]:
            e = text.find('const lastPriceChangePercent = pickFirstNumber(', s)
            if e < 0 or 'priceChangePercent' in text[s:e]: raise SystemExit('closing percentage still uses generic priceChangePercent')
          print('Verified: closing percentage is isolated from last-traded percentage.')

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Commit and cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/StockAnalysis.tsx
          git commit -m 'fix: separate closing and last price percentages'
          git push
          git rm .github/workflows/fix-closing-percent.yml
          git commit -m 'chore: remove temporary closing percent workflow'
          git push
