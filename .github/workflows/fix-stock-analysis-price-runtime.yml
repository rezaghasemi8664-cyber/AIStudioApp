name: Fix StockAnalysis price runtime

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch StockAnalysis price variables
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('src/components/StockAnalysis.tsx')
          text = path.read_text(encoding='utf-8-sig')

          old = '''  const priceChangePercent = pickFirstNumber(\n    marketData.priceChangePercent, marketData.changePercent, marketData.priceChange, marketData.change, marketData.chp,\n    lastHistoryRecord.priceChangePercent, lastHistoryRecord.changePercent,\n    mergedMetrics?.priceChangePercent, source.priceChangePercent, source.changePercent\n  );'''

          new = '''  const closingPriceChangePercent = pickFirstNumber(\n    marketData.closingPriceChangePercent, marketData.closeChangePercent, marketData.pcp,\n    lastHistoryRecord.closingPriceChangePercent, lastHistoryRecord.closeChangePercent, lastHistoryRecord.pcp,\n    source.closingPriceChangePercent, source.closeChangePercent, source.pcp,\n    mergedMetrics?.closingPriceChangePercent\n  );\n\n  const lastPriceChangePercent = pickFirstNumber(\n    marketData.lastPriceChangePercent, marketData.lastChangePercent, marketData.plp,\n    lastHistoryRecord.lastPriceChangePercent, lastHistoryRecord.lastChangePercent, lastHistoryRecord.plp,\n    source.lastPriceChangePercent, source.lastChangePercent, source.plp,\n    mergedMetrics?.lastPriceChangePercent\n  );'''

          if old not in text:
              raise SystemExit('Expected old priceChangePercent block was not found')

          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/StockAnalysis.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: define closing and last price change percentages"
          git push