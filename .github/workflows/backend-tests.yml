name: Backend Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/scalping-technical-price-levels]

jobs:
  backend-jest:
    name: Backend Jest Tests (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
      - name: Run backend Jest tests
        run: npm test -- --runInBand tests/market-history-date.test.js tests/scalping-price-levels.test.js tests/valuable-symbols-engine.test.js tests/valuable-symbols-price-refresh.test.js
