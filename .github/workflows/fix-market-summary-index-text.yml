name: Fix market summary index text

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch market summary text
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/services/marketSummary.service.cjs')
          s = p.read_text(encoding='utf-8-sig')
          start_marker = 'function buildEightPartSummary(data, aiText) {'
          end_marker = '\nfunction extractAiText('
          start = s.find(start_marker)
          end = s.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Target buildEightPartSummary block not found')

          new = r'''function calculateIndexChangePercent(indexValue, changeValue) {
  const current = toNumber(indexValue);
  const change = toNumber(changeValue);
  if (current === null || change === null) return null;

  const previousClose = current - change;
  if (!Number.isFinite(previousClose) || previousClose === 0) return null;

  const percent = (change / previousClose) * 100;
  return Number.isFinite(percent) ? percent : null;
}

function formatIndexPercent(value) {
  const n = toNumber(value);
  if (n === null) return 'نامشخص';
  const abs = new Intl.NumberFormat('fa-IR', {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  }).format(Math.abs(n));
  return `${n >= 0 ? '+' : '-'}${abs}٪`;
}

function buildEightPartSummary(data, _aiText) {
  // اعداد این بخش همیشه از Snapshot واقعی همان روز ساخته می‌شوند.
  // متن AI ذخیره‌شده عمداً برای جلوگیری از ورود اعداد قدیمی/متعلق به روز دیگر
  // در متن خلاصه بازار استفاده نمی‌شود.
  const statusFa = data.marketStatus === 'open' ? 'باز' : data.marketStatus === 'close' ? 'بسته' : 'نامشخص';
  const overallChange = toNumber(data.overallChange);
  const equalChange = toNumber(data.equalChange);
  const overallPercent = calculateIndexChangePercent(data.overallIndex, overallChange);
  const equalPercent = calculateIndexChangePercent(data.equalIndex, equalChange);
  const overallDirection = overallChange === null ? 'نامشخص' : overallChange > 0 ? 'مثبت' : overallChange < 0 ? 'منفی' : 'بدون تغییر';

  return [
    `۱) وضعیت کلی بازار: وضعیت بازار ${statusFa} گزارش شده و برآیند عمومی معاملات ${overallDirection} است.`,
    `۲) شاخص‌ها: شاخص کل ${faNum(data.overallIndex)} واحد با تغییر ${formatIndexPercent(overallPercent)}؛ شاخص هم‌وزن ${faNum(data.equalIndex)} واحد با تغییر ${formatIndexPercent(equalPercent)}.`,
    `۳) نقدشوندگی و معاملات: تعداد معاملات ${faNum(data.totalTrades)}، حجم معاملات ${faNum(data.totalVolume)} و ارزش معاملات ${faNum(data.totalValue)} بوده است.`,
    `۴) پهنای بازار: نمادهای مثبت ${faNum(data.positiveStocks)}، منفی ${faNum(data.negativeStocks)} و خنثی ${faNum(data.neutralStocks)} هستند.`,
    `۵) برترین‌های رشد: ${pickTopSymbols(data.topGainers)}.`,
    `۶) برترین‌های افت: ${pickTopSymbols(data.topLosers)}.`,
    `۷) برترین‌های معاملاتی: ${pickTopSymbols(data.topVolumes)}.`,
    `۸) جمع‌بندی عملیاتی: با توجه به داده‌های ثبت‌شده همین روز، تصمیم‌گیری کوتاه‌مدت باید بر مبنای روند واقعی شاخص‌ها، پهنای بازار و نقدشوندگی انجام شود و مدیریت ریسک مرحله‌ای رعایت شود.`
  ].join('\\n');
}
'''
          p.write_text(s[:start] + new + s[end:], encoding='utf-8')
          PY

      - name: Validate source
        shell: bash
        run: node --check backend/services/marketSummary.service.cjs

      - name: Commit corrected service
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/services/marketSummary.service.cjs
          git commit -m "fix: build market summary index text from daily snapshot"
          git push origin HEAD:main
