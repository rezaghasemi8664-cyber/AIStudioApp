name: Patch Dashboard Navigation

on:
  push:
    paths:
      - '.github/workflows/patch-dashboard-nav.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch App.tsx
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text(encoding='utf-8')
          if "import Dashboard from './components/Dashboard';" not in s:
              s = s.replace("import MarketIndex from './components/MarketIndex';\n", "import MarketIndex from './components/MarketIndex';\nimport Dashboard from './components/Dashboard';\n", 1)
          if "| 'dashboard'" not in s:
              s = s.replace("type Tab =\n  | 'analysis'", "type Tab =\n  | 'dashboard'\n  | 'analysis'", 1)
          s = s.replace("const [activeTab, setActiveTab] = useState<Tab>('analysis');", "const [activeTab, setActiveTab] = useState<Tab>('dashboard');", 1)
          if "case 'dashboard':" not in s:
              anchor = "    switch (activeTab) {\n"
              if anchor not in s:
                  raise SystemExit('Missing switch(activeTab) anchor')
              addition = "      case 'dashboard':\n        return <Dashboard isOnline={isOnline} onNavigate={(target) => handleTabClick(target as Tab)} />;\n\n"
              s = s.replace(anchor, anchor + addition, 1)
          if 'tab="dashboard"' not in s:
              anchor = '            <TabButton\n              tab="analysis"'
              if anchor not in s:
                  raise SystemExit('Missing analysis TabButton anchor')
              addition = '            <TabButton\n              tab="dashboard"\n              label="داشبورد"\n              icon={<PresentationChartLineIcon />}\n              alertType="none"\n              activeTab={activeTab}\n              onTabClick={handleTabClick}\n            />\n\n'
              s = s.replace(anchor, addition + anchor, 1)
          p.write_text(s, encoding='utf-8')

      - name: Remove temporary workflow
        run: rm -f .github/workflows/patch-dashboard-nav.yml

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx .github/workflows/patch-dashboard-nav.yml
          git diff --cached --check
          git commit -m "feat: connect dashboard 3.0 to app navigation"
          git push origin main
