name: Patch Dashboard Navigation

on:
  push:
    paths:
      - '.github/workflows/patch-dashboard-nav.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch App.tsx
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text(encoding='utf-8')
          replacements = [
            ("import MarketIndex from './components/MarketIndex';\n", "import MarketIndex from './components/MarketIndex';\nimport Dashboard from './components/Dashboard';\n"),
            ("type Tab =\n  | 'analysis'", "type Tab =\n  | 'dashboard'\n  | 'analysis'"),
            ("const [activeTab, setActiveTab] = useState<Tab>('analysis');", "const [activeTab, setActiveTab] = useState<Tab>('dashboard');"),
            ("setActiveTab('analysis');\n      setInitError(null);", "setActiveTab('dashboard');\n      setInitError(null);"),
            ("setActiveTab('analysis');\n    setPortfolioAlert", "setActiveTab('dashboard');\n    setPortfolioAlert"),
            ("    switch (activeTab) {\n      case 'analysis':", "    switch (activeTab) {\n      case 'dashboard':\n        return <Dashboard isOnline={isOnline} onNavigate={(target) => handleTabClick(target as Tab)} />;\n\n      case 'analysis':"),
            ("          <div className=\"app-nav-scroll flex flex-wrap items-center border-b border-gray-200 dark:border-gray-700\">\n            <TabButton\n              tab=\"analysis\"", "          <div className=\"app-nav-scroll flex flex-wrap items-center border-b border-gray-200 dark:border-gray-700\">\n            <TabButton\n              tab=\"dashboard\"\n              label=\"داشبورد\"\n              icon={<PresentationChartLineIcon />}\n              alertType=\"none\"\n              activeTab={activeTab}\n              onTabClick={handleTabClick}\n            />\n\n            <TabButton\n              tab=\"analysis\""),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Missing expected anchor: {old[:80]!r}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

      - name: Remove temporary patch workflow
        run: rm -f .github/workflows/patch-dashboard-nav.yml

      - name: Commit dashboard integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx .github/workflows/patch-dashboard-nav.yml
          git diff --cached --check
          git commit -m "feat: connect dashboard 3.0 to app navigation"
          git push origin main
