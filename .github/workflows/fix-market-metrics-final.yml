name: Final market metrics correction
on:
  push:
    paths:
      - '.github/workflows/fix-market-metrics-final.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch remaining metric fallbacks
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          changed=False
          def patch(path, pairs):
              global changed
              p=Path(path); s=p.read_text(encoding='utf-8-sig'); old=s
              for a,b in pairs:
                  if a in s: s=s.replace(a,b,1)
              if s!=old: p.write_text(s,encoding='utf-8-sig'); changed=True
          patch('src/components/StockAnalysis.tsx', [
            ("priceChangePercent: pickFirstNumber(mm.priceChangePercent, mm.pctChange, mm.changePercent, mm.priceChange, mm.change, mm.chp),", "priceChangePercent: pickFirstNumber(mm.priceChangePercent, mm.pctChange, mm.changePercent),"),
            ("tradedValue: pickFirstNumber(mm.tradedValue, mm.tradeValue, mm.value, mm.qTotCap, mm.tval, mm.qTotTran5J),", "tradedValue: pickFirstNumber(mm.tradedValue, mm.tradeValue, mm.value, mm.qTotCap, mm.tval),")
          ])
          patch('backend/controllers/analyze.controller.cjs', [
            ("  if (priceChangePercent === null && priceChange !== null && closingPrice !== null && closingPrice !== 0) priceChangePercent = (priceChange / closingPrice) * 100;", "  if (priceChangePercent === null && lastPrice !== null && yesterdayClose !== null && yesterdayClose !== 0) priceChangePercent = ((lastPrice - yesterdayClose) / yesterdayClose) * 100;"),
            ("const tradedValue = tradedValueDirect !== null ? tradedValueDirect : (derivedPrice !== null && tradedVolume !== null ? derivedPrice * tradedVolume : null);", "const tradedValue = tradedValueDirect;")
          ])
          wf=Path('.github/workflows/fix-market-metrics-final.yml')
          wf.unlink()
          subprocess.run(['node','--check','backend/services/brs.service.cjs'],check=True)
          subprocess.run(['node','--check','backend/controllers/analyze.controller.cjs'],check=True)
          subprocess.run(['git','diff','--check'],check=True)
          if changed:
              subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
              subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
              subprocess.run(['git','add','src/components/StockAnalysis.tsx','backend/controllers/analyze.controller.cjs','.github/workflows/fix-market-metrics-final.yml'],check=True)
              subprocess.run(['git','commit','-m','fix: correct remaining market metric fallbacks'],check=True)
              subprocess.run(['git','push'],check=True)