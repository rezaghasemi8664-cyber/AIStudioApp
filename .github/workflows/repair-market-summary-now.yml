name: Repair market summary now

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair frontend source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/components/MarketSummaryDashboard.tsx')
          s = p.read_text(encoding='utf-8-sig')
          s = s.replace('```tsx\n', '').replace('\n```\n', '\n').replace('\n```', '\n')

          old = """  useEffect(() => {\n    if (suppliedIntelligence || loading) return;\n\n    let active = true;\n\n    setFetching(true);\n\n    getLatestSummary()\n      .then((summary: any) => {\n        if (active) {\n          setFetchedIntelligence(\n            summary?.marketIntelligence ?? null\n          );\n        }\n      })\n"""
          new = """  useEffect(() => {\n    if (loading) return;\n\n    let active = true;\n\n    setFetching(true);\n\n    getLatestSummary()\n      .then((summary: any) => {\n        if (active) {\n          setFetchedIntelligence(\n            summary?.marketIntelligence ?? null\n          );\n        }\n      })\n"""
          if old in s:
              s = s.replace(old, new, 1)

          old2 = """  const intelligence =\n    suppliedIntelligence ?? fetchedIntelligence;\n\n  if (loading || fetching) {\n"""
          new2 = """  const intelligence =\n    suppliedIntelligence ?? fetchedIntelligence;\n\n  const canonicalContent =\n    content || null;\n\n  if (loading || fetching) {\n"""
          if old2 in s:
              s = s.replace(old2, new2, 1)

          old3 = """  if (!intelligence) {\n    return (\n"""
          new3 = """  if (canonicalContent) {\n    return (\n      <div\n        dir=\"rtl\"\n        className=\"rounded-[20px] border border-white/10 bg-slate-950/70 p-6\"\n        style={{\n          fontFamily:\n            'Vazirmatn, IRANSans, Tahoma, Arial, sans-serif',\n        }}\n      >\n        <div className=\"text-[18px] font-extrabold text-white\">\n          خلاصه بازار\n        </div>\n        <div className=\"mt-4 whitespace-pre-wrap rounded-2xl border border-white/[0.07] bg-white/[0.025] p-5 text-[15px] leading-[2] text-slate-200\">\n          {canonicalContent}\n        </div>\n      </div>\n    );\n  }\n\n  if (!intelligence) {\n    return (\n"""
          if old3 in s:
              s = s.replace(old3, new3, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/MarketSummaryDashboard.tsx
          if git diff --cached --quiet; then echo 'No repair needed'; exit 0; fi
          git commit -m 'fix: show canonical latest market summary content'
          git push origin main
