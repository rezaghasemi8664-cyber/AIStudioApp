name: Fix Prisma schema constraint maps

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !startsWith(github.event.head_commit.message, 'Fix schema constraint maps') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix constraint map names
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/prisma/schema.prisma')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'DF__admin_sc__isEna__058EC7FB': 'DF__admin_sch__isEna__058EC7FB',
              'DF__admin_sc__creat__0682EC34': 'DF__admin_sch__creat__0682EC34',
              'DF__admin_sc__updat__0777106D': 'DF__admin_sch__updat__0777106D',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/prisma/schema.prisma
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Fix schema constraint maps"
          git push
