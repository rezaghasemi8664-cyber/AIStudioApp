name: Fix market history structure

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'fix: normalize market history sessions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch market history normalization
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('backend/services/marketHistory.service.cjs')
          s = p.read_text(encoding='utf-8-sig')

          old = '''  const indexChange = toFiniteNumber(\n    raw.index_change ?? raw.indexChange ?? raw.changeValue ?? raw.marketIndexChange,\n    0\n  );\n\n  const indexEqualWeight = toFiniteNumber(\n    raw.indexEqualWeight ??\n      raw.index_equalWeight ??\n      raw.equalWeightedValue ??\n      raw.equalWeightedIndex,\n    0\n  );\n\n  const indexEqualWeightChange = toFiniteNumber(\n    raw.indexEqualWeightChange ??\n      raw.index_equalWeight_change ??\n      raw.equalWeightedChangeValue,\n    0\n  );'''
          new = '''  const indexChangeRaw =\n    raw.index_change ?? raw.indexChange ?? raw.changeValue ?? raw.marketIndexChange;\n  const indexChange = indexChangeRaw == null || indexChangeRaw === ''\n    ? null\n    : toFiniteNumber(indexChangeRaw, NaN);\n\n  const equalIndexRaw =\n    raw.indexEqualWeight ??\n    raw.index_equalWeight ??\n    raw.equalWeightedValue ??\n    raw.equalWeightedIndex;\n  const indexEqualWeight = equalIndexRaw == null || equalIndexRaw === ''\n    ? null\n    : toFiniteNumber(equalIndexRaw, NaN);\n\n  const equalChangeRaw =\n    raw.indexEqualWeightChange ??\n    raw.index_equalWeight_change ??\n    raw.equalWeightedChangeValue;\n  const indexEqualWeightChange = equalChangeRaw == null || equalChangeRaw === ''\n    ? null\n    : toFiniteNumber(equalChangeRaw, NaN);'''
          if old not in s:
              raise SystemExit('Expected normalization block not found')
          s = s.replace(old, new, 1)

          old2 = '''    value: index,\n    changeValue: indexChange,\n    equalWeightedValue: indexEqualWeight,\n    equalWeightedChangeValue: indexEqualWeightChange,'''
          new2 = '''    value: index,\n    changeValue: indexChange,\n    equalWeightedValue: indexEqualWeight,\n    equalWeightedChangeValue: indexEqualWeightChange,\n    // Canonical fields used by the session builder. Keeping the trading date\n    // inside jsonData prevents later calculations from depending on DB insert time.\n    tradingDate: date,\n    snapshotTime: raw.lastUpdate || raw.timestamp || raw.createdAt || `${date} ${time}`.trim(),'''
          if old2 not in s:
              raise SystemExit('Expected stable payload block not found')
          s = s.replace(old2, new2, 1)

          old3 = '''async function getMarketHistory(limit = 30) {'''
          new3 = '''async function getMarketHistory(limit = 5000) {'''
          if old3 not in s:
              raise SystemExit('Expected getMarketHistory signature not found')
          s = s.replace(old3, new3, 1)

          p.write_text(s, encoding='utf-8')

          p = Path('backend/controllers/liveMarketSummary.controller.cjs')
          s = p.read_text(encoding='utf-8-sig')

          old4 = '''function snapshotTradingDate(snapshot) {\n  const raw = snapshotValue(snapshot, 'date', 'summaryDate', 'marketDateJalali');'''
          new4 = '''function snapshotTradingDate(snapshot) {\n  const raw = snapshotValue(snapshot, 'tradingDate', 'date', 'summaryDate', 'marketDateJalali');'''
          if old4 not in s:
              raise SystemExit('Expected snapshotTradingDate block not found')
          s = s.replace(old4, new4, 1)

          old5 = '''function snapshotTime(snapshot) {\n  const raw = snapshotValue(snapshot, 'time', 'lastUpdate', 'timestamp', 'createdAt', '_createdAt');'''
          new5 = '''function snapshotTime(snapshot) {\n  const raw = snapshotValue(snapshot, 'snapshotTime', 'lastUpdate', 'time', 'timestamp', 'createdAt', '_createdAt');'''
          if old5 not in s:
              raise SystemExit('Expected snapshotTime block not found')
          s = s.replace(old5, new5, 1)

          old6 = '''      marketHistoryService.getMarketHistory(3000).catch(error => [])'''
          new6 = '''      marketHistoryService.getMarketHistory(5000).catch(error => [])'''
          if old6 not in s:
              raise SystemExit('Expected history fetch limit not found')
          s = s.replace(old6, new6, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/services/marketHistory.service.cjs backend/controllers/liveMarketSummary.controller.cjs
          git diff --cached --quiet && exit 0
          git commit -m "fix: normalize market history sessions"
          git push
