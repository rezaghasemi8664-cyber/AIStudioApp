name: One-time TypeScript fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-typecheck-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Fix history item type usage
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/components/StockAnalysis.tsx')
          s = p.read_text(encoding='utf-8-sig')
          old = "  result: AnalysisResult | null;\n  createdAt: string;\n};"
          new = "  result: AnalysisResult | null;\n  summary?: string;\n  createdAt: string;\n};"
          if old not in s:
              raise SystemExit('Expected local AnalysisHistoryItem definition was not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

      - name: Typecheck
        run: |
          npm ci
          npm run typecheck

      - name: Build
        run: npm run build

      - name: Commit source fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/StockAnalysis.tsx
          git commit -m "fix: type history summary field"
          git push origin main

# trigger workflow after creation