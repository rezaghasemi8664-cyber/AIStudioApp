name: Fix market summary numeric text

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace numeric summary formatter
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('backend/services/marketSummary.service.cjs')
          text = path.read_text(encoding='utf-8-sig')

          start = text.find('function buildEightPartSummary(data, aiText) {')
          end = text.find('\nfunction extractAiText(', start)
          if start < 0 or end < 0:
              raise SystemExit('Could not locate buildEightPartSummary boundaries')

          replacement = r'''function calculateChangePercent(currentValue, absoluteChange) {
  const current = toNumber(currentValue);
  const change = toNumber(absoluteChange);
  if (current === null || change === null) return null;

  // TSETMC-style index change is an absolute difference from the previous
  // close. Therefore percentage change must be calculated from the previous
  // close, not by treating change_index as an already-percent value.
  const previousClose = current - change;
  if (!Number.isFinite(previousClose) || previousClose === 0) return null;

  const percent = (change / previousClose) * 100;
  return Number.isFinite(percent) ? percent : null;
}

function formatSignedPercent(value) {
  const n = toNumber(value);
  if (n === null) return 'نامشخص';

  const formatted = new Intl.NumberFormat('fa-IR', {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  }).format(Math.abs(n));

  return `${n >= 0 ? '+' : '-'}${formatted}٪`;
}

function formatIndexValue(value) {
  const n = toNumber(value);
  if (n === null) return 'نامشخص';
  return new Intl.NumberFormat('fa-IR', {
    minimumFractionDigits: 0,
    maximumFractionDigits: 2
  }).format(n);
}

function buildEightPartSummary(data, _aiText) {
  // Numeric facts in the final market-summary text must ALWAYS come from the
  // normalized market snapshot. Never return the stored AI text wholesale,
  // because historical AI text can contain stale/incorrect index numbers or
  // percentages from a different snapshot.
  const statusFa = data.marketStatus === 'open' ? 'باز' : data.marketStatus === 'close' ? 'بسته' : 'نامشخص';

  const overallChange = toNumber(data.overallChange);
  const equalChange = toNumber(data.equalChange);
  const overallChangePct = calculateChangePercent(data.overallIndex, overallChange);
  const equalChangePct = calculateChangePercent(data.equalIndex, equalChange);

  const overallDirection = overallChange === null ? 'نامشخص' : overallChange > 0 ? 'مثبت' : overallChange < 0 ? 'منفی' : 'بدون تغییر';

  return [
    `۱) وضعیت کلی بازار: وضعیت بازار ${statusFa} گزارش شده و برآیند عمومی معاملات ${overallDirection} است.`,
    `۲) شاخص‌ها: شاخص کل ${formatIndexValue(data.overallIndex)} واحد با تغییر ${formatSignedPercent(overallChangePct)}؛ شاخص هم‌وزن ${formatIndexValue(data.equalIndex)} واحد با تغییر ${formatSignedPercent(equalChangePct)}.`,
    `۳) نقدشوندگی و معاملات: تعداد معاملات ${faNum(data.totalTrades)}، حجم معاملات ${faNum(data.totalVolume)} و ارزش معاملات ${faNum(data.totalValue)} بوده است.`,
    `۴) پهنای بازار: نمادهای مثبت ${faNum(data.positiveStocks)}، منفی ${faNum(data.negativeStocks)} و خنثی ${faNum(data.neutralStocks)} هستند.`,
    `۵) برترین‌های رشد: ${pickTopSymbols(data.topGainers)}.`,
    `۶) برترین‌های افت: ${pickTopSymbols(data.topLosers)}.`,
    `۷) برترین‌های معاملاتی: ${pickTopSymbols(data.topVolumes)}.`,
    `۸) جمع‌بندی عملیاتی: با توجه به داده‌های ثبت‌شده همین روز، تصمیم‌گیری کوتاه‌مدت باید بر مبنای روند واقعی شاخص‌ها، breadth بازار و نقدشوندگی انجام شود و مدیریت ریسک مرحله‌ای رعایت شود.`
  ].join('\n');
}
'''

          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding='utf-8')
          print('Updated market summary numeric formatter.')

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/services/marketSummary.service.cjs
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix: use authoritative index change percentages in market summary text"
          git push origin HEAD:main
