name: Normalize Daily Filters Navigation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize-navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Keep exactly one daily filters tab
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('src/App.tsx')
          s = p.read_text(encoding='utf-8-sig')

          pattern = re.compile(
              r'\n\s*<TabButton\s*\n'
              r'\s*tab="dailyFilters"\s*\n'
              r'\s*label="فیلترهای روزانه"\s*\n'
              r'\s*icon=\{<PresentationChartLineIcon />\}\s*\n'
              r'\s*alertType="none"\s*\n'
              r'\s*locked=\{isExpired\}\s*\n'
              r'\s*activeTab=\{activeTab\}\s*\n'
              r'\s*onTabClick=\{handleTabClick\}\s*\n'
              r'\s*/>',
              re.MULTILINE,
          )

          matches = list(pattern.finditer(s))
          print(f'Found dailyFilters TabButton occurrences: {len(matches)}')
          if not matches:
              raise SystemExit('No dailyFilters TabButton found')

          # Preserve the first occurrence and remove all subsequent occurrences.
          first_end = matches[0].end()
          prefix = s[:first_end]
          suffix = s[first_end:]
          suffix = pattern.sub('', suffix)
          s = prefix + suffix

          remaining = len(list(pattern.finditer(s)))
          print(f'Remaining dailyFilters TabButton occurrences: {remaining}')
          if remaining != 1:
              raise SystemExit('Expected exactly one dailyFilters TabButton')

          p.write_text(s, encoding='utf-8')

      - name: Build verification
        run: |
          npm ci
          npm run build

      - name: Commit only if source changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          if git diff --cached --quiet; then
            echo "No navigation change required."
            exit 0
          fi
          git commit -m "fix: keep exactly one daily filters navigation tab"
          git push
