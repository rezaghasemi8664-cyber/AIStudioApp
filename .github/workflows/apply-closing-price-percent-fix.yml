name: Apply closing price percent fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch StockAnalysis closing-price percentage
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('src/components/StockAnalysis.tsx')
          text = path.read_text(encoding='utf-8-sig')

          # The backend BRS adapter already distinguishes:
          #   priceChangePercent = last/live price change
          #   closeChangePercent = closing-price change
          # Make the UI consume the closing field from mergedMetrics and never
          # substitute the live percentage when the closing field is absent.
          closing = re.compile(
              r'(const closingPriceChangePercent = pickFirstNumber\()(.*?)(\n\s*\);\n\n\s*const lastPriceChangePercent = pickFirstNumber\()',
              re.S,
          )

          m = closing.search(text)
          if not m:
              raise SystemExit('closing percentage block not found')

          block = m.group(2)
          # Remove any generic live-price percentage aliases from the closing block.
          block = re.sub(r'\n\s*(?:marketData|lastHistoryRecord|source)\.priceChangePercent,?', '', block)
          block = re.sub(r'\n\s*mergedMetrics\?\.priceChangePercent,?', '', block)
          block = re.sub(r'\n\s*\(mergedMetrics as any\)\?\.priceChangePercent,?', '', block)

          if '(mergedMetrics as any)?.closeChangePercent' not in block:
              block = block.rstrip() + '\n    (mergedMetrics as any)?.closeChangePercent,\n'

          text = text[:m.start(2)] + block + text[m.end(2):]

          # Map the backend's canonical live percentage as a fallback for the
          # live-price field only.
          live = re.compile(
              r'(const lastPriceChangePercent = pickFirstNumber\()(.*?)(\n\s*\);)',
              re.S,
          )
          lm = live.search(text)
          if not lm:
              raise SystemExit('live percentage block not found')
          live_block = lm.group(2)
          if '(mergedMetrics as any)?.priceChangePercent' not in live_block:
              live_block = live_block.rstrip() + '\n    (mergedMetrics as any)?.priceChangePercent,\n'
          text = text[:lm.start(2)] + live_block + text[lm.end(2):]

          path.write_text(text, encoding='utf-8-sig')
          print('Closing/live percentage mapping repaired.')

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/StockAnalysis.tsx
          git diff --cached --quiet && { echo 'No source change'; exit 0; }
          git commit -m "fix: correctly display closing price percentage"
          git push
