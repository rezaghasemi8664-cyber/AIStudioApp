name: One-time Persian comparison prompt fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-comparison-language:
    if: github.event.head_commit.message != 'fix: enforce Persian comparator generation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch comparator system prompt
        shell: python
        run: |
          from pathlib import Path

          path = Path('backend/services/ai.service.cjs')
          text = path.read_text(encoding='utf-8-sig')

          old = """  comparator: [\n    'شما یک تحلیلگر مقایسه‌ای سهام بازار بورس ایران هستید.',\n    'دو یا چند سهم را از نظر تکنیکال، بنیادی و ریسک مقایسه کرده و برنده را مشخص کنید.',\n    'پاسخ را در قالب JSON برگردانید.',\n  ].join(' '),"""

          new = """  comparator: [\n    'شما یک تحلیلگر حرفه‌ای و مقایسه‌ای سهام بازار بورس ایران هستید.',\n    'دو یا چند سهم را از نظر تکنیکال، بنیادی، ارزش‌گذاری، نقدشوندگی و ریسک بر اساس داده‌های ارسالی مقایسه کنید و گزینه برتر را مشخص کنید.',\n    'خروجی باید از ابتدا تا انتها فقط به زبان فارسی تولید شود؛ تمام عنوان‌ها، خلاصه‌ها، توضیحات، تحلیل‌های تکنیکال و بنیادی، دلایل، نتیجه‌گیری‌ها، سطح ریسک و توصیه‌ها باید فارسی باشند.',\n    'هیچ کلمه، عبارت یا جمله انگلیسی در مقادیر متنی خروجی مجاز نیست. از تولید متن انگلیسی و سپس ترجمه خودکار خودداری کنید و متن را مستقیماً فارسی بنویسید.',\n    'مقادیر recommendation فقط یکی از این گزینه‌ها باشد: خرید قوی، خرید، نگهداری، فروش، فروش قوی، خنثی.',\n    'کلیدهای JSON داخلی را مطابق قرارداد موجود حفظ کنید، اما تمام مقدارهای متنی JSON را فارسی تولید کنید.',\n    'نام نمادهای بورسی، EPS و P/E و اعداد مالی را ترجمه نکنید؛ این‌ها شناسه یا اصطلاحات استاندارد مالی هستند.',\n    'پاسخ فقط JSON خالص و معتبر باشد و هیچ متن اضافی خارج از JSON نوشته نشود.',\n  ].join(' '),"""

          if old not in text:
              raise SystemExit('Comparator prompt block not found; aborting without changes.')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit backend prompt and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/services/ai.service.cjs
          git rm .github/workflows/one-time-persian-comparison.yml
          git commit -m "fix: enforce Persian comparator generation"
          git push
