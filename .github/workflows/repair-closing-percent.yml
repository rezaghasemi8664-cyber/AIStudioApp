name: Repair closing percent and build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: "!contains(github.event.head_commit.message, 'closing percent repair commit')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/StockAnalysis.tsx')
          s = p.read_text(encoding='utf-8-sig')

          # Backend BRS exposes two distinct percentages:
          # priceChangePercent = last/live price percentage
          # closeChangePercent = closing-price percentage
          # The UI must consume both from mergedMetrics without falling back
          # from closing percent to the live percent.
          old = "    mergedMetrics?.closingPriceChangePercent\n  );"
          new = "    mergedMetrics?.closingPriceChangePercent,\n    (mergedMetrics as any)?.closeChangePercent\n  );"
          if old in s and new not in s:
              s = s.replace(old, new, 1)

          old_last = "    mergedMetrics?.lastPriceChangePercent\n  );"
          new_last = "    mergedMetrics?.lastPriceChangePercent,\n    (mergedMetrics as any)?.priceChangePercent\n  );"
          if old_last in s and new_last not in s:
              s = s.replace(old_last, new_last, 1)

          p.write_text(s, encoding='utf-8-sig')
          PY

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Commit repaired source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/StockAnalysis.tsx
          git diff --cached --quiet && { echo 'No source change'; exit 0; }
          git commit -m 'fix: closing percent repair commit'
          git push
