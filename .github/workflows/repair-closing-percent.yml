name: Repair closing percent and build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: "!contains(github.event.head_commit.message, 'closing percent repair commit')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/StockAnalysis.tsx')
          s = p.read_text(encoding='utf-8-sig')

          old = '''  const closingPriceChangePercent = pickFirstNumber(
    marketData.closingPriceChangePercent,
    marketData.closeChangePercent,
    marketData.pcp,
    lastHistoryRecord.closingPriceChangePercent,
    lastHistoryRecord.closeChangePercent,
    lastHistoryRecord.pcp,
    source.closingPriceChangePercent,
    source.closeChangePercent,
    source.pcp,
    mergedMetrics?.closingPriceChangePercent
    (mergedMetrics as any)?.closeChangePercent,

  );

  const lastPriceChangePercent = pickFirstNumber(
    marketData.lastPriceChangePercent, marketData.lastChangePercent, marketData.plp,
    lastHistoryRecord.lastPriceChangePercent, lastHistoryRecord.lastChangePercent, lastHistoryRecord.plp,
    source.lastPriceChangePercent, source.lastChangePercent, source.plp,
    mergedMetrics?.lastPriceChangePercent
    (mergedMetrics as any)?.priceChangePercent,

  );'''

          new = '''  const closingPriceChangePercent = pickFirstNumber(
    marketData.closingPriceChangePercent,
    marketData.closeChangePercent,
    marketData.pcp,
    lastHistoryRecord.closingPriceChangePercent,
    lastHistoryRecord.closeChangePercent,
    lastHistoryRecord.pcp,
    source.closingPriceChangePercent,
    source.closeChangePercent,
    source.pcp,
    mergedMetrics?.closingPriceChangePercent,
    (mergedMetrics as any)?.closeChangePercent,
    (mergedMetrics as any)?.pcp,
  );

  const lastPriceChangePercent = pickFirstNumber(
    marketData.lastPriceChangePercent,
    marketData.lastChangePercent,
    marketData.plp,
    lastHistoryRecord.lastPriceChangePercent,
    lastHistoryRecord.lastChangePercent,
    lastHistoryRecord.plp,
    source.lastPriceChangePercent,
    source.lastChangePercent,
    source.plp,
    mergedMetrics?.lastPriceChangePercent,
    (mergedMetrics as any)?.priceChangePercent,
  );'''

          if old not in s:
              raise SystemExit('Expected malformed percentage block was not found')
          s = s.replace(old, new, 1)

          marker = "    priceChangePercent: pickFirstNumber(mm.priceChangePercent, mm.pctChange, mm.changePercent),\n"
          addition = marker + "    closingPriceChangePercent: pickFirstNumber(mm.closingPriceChangePercent, mm.closeChangePercent, mm.pcp),\n"
          if 'closingPriceChangePercent: pickFirstNumber(mm.closingPriceChangePercent' not in s:
              if marker not in s:
                  raise SystemExit('normalizeMarketMetrics marker was not found')
              s = s.replace(marker, addition, 1)

          p.write_text(s, encoding='utf-8-sig')
          print('Closing percentage now maps only to closeChangePercent/pcp; live percentage maps to priceChangePercent.')
          PY

      - name: Verify source mapping
        shell: bash
        run: |
          grep -n "closingPriceChangePercent" src/components/StockAnalysis.tsx
          grep -n "closeChangePercent" src/components/StockAnalysis.tsx
          grep -n "priceChangePercent" src/components/StockAnalysis.tsx

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Commit repaired source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/StockAnalysis.tsx
          git diff --cached --quiet && { echo 'No source change'; exit 0; }
          git commit -m 'fix: closing percent repair commit'
          git push
