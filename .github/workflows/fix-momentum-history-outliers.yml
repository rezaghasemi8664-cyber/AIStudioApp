name: Fix momentum history outliers

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch momentum calculation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/controllers/liveMarketSummary.controller.cjs')
          text = path.read_text(encoding='utf-8')

          old = """function calculateMomentum(sessions) {\n  const valid = Array.isArray(sessions) ? sessions.filter(x => snapshotIndex(x.snapshot) !== null && snapshotIndex(x.snapshot, true) !== null) : [];\n  if (valid.length < 2) {\n"""

          new = """function calculateMomentum(sessions) {\n  const candidates = Array.isArray(sessions)\n    ? sessions.filter(x => snapshotIndex(x.snapshot) !== null && snapshotIndex(x.snapshot, true) !== null)\n    : [];\n\n  // Historical snapshots created by older versions of the market mapper may\n  // contain an invalid index scale. Such records can produce impossible\n  // one-/three-/five-session returns (for example -60% to -70%) even when the\n  // current daily index move is around -1%. Keep only sessions that are within\n  // a conservative day-over-day bound from the most recent accepted session.\n  // A 25% one-session index move is far beyond the normal index range and is\n  // therefore a safe data-quality guard, while still leaving ample headroom.\n  const MAX_SESSION_MOVE_PERCENT = 25;\n  const relativeMove = (current, previous) => {\n    if (!Number.isFinite(current) || !Number.isFinite(previous) || previous === 0) return null;\n    return Math.abs(((current - previous) / previous) * 100);\n  };\n\n  const valid = [];\n  for (const candidate of candidates) {\n    if (valid.length === 0) {\n      valid.push(candidate);\n      continue;\n    }\n\n    const previous = valid[valid.length - 1].snapshot;\n    const overallMove = relativeMove(snapshotIndex(candidate.snapshot), snapshotIndex(previous));\n    const equalMove = relativeMove(snapshotIndex(candidate.snapshot, true), snapshotIndex(previous, true));\n\n    if (overallMove !== null && equalMove !== null &&\n        overallMove <= MAX_SESSION_MOVE_PERCENT &&\n        equalMove <= MAX_SESSION_MOVE_PERCENT) {\n      valid.push(candidate);\n    }\n  }\n\n  if (valid.length < 2) {\n"""

          if old not in text:
              raise SystemExit('Target calculateMomentum block was not found')

          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          print('Patched', path)
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/controllers/liveMarketSummary.controller.cjs
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "fix: reject invalid market history sessions in momentum"
          git push origin HEAD:main
