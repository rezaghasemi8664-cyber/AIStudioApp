name: Fix stock analysis price change

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-price-change-percent.yml'
      - 'src/components/StockAnalysis.tsx'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fix undefined priceChangePercent
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/components/StockAnalysis.tsx')
          s = p.read_text(encoding='utf-8-sig')
          old = "        priceChangePercent,\n        pe,"
          new = "        closingPriceChangePercent,\n        lastPriceChangePercent,\n        pe,"
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8-sig')
          if old in s:
              raise SystemExit('unexpected replacement state')
      - name: Commit source fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo 'No source change required'
          else
            git add src/components/StockAnalysis.tsx
            git commit -m 'fix: remove undefined priceChangePercent reference'
            git push origin main
          fi
      - name: Remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-price-change-percent.yml
          git add .github/workflows/fix-price-change-percent.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: remove temporary price fix workflow'
          git push origin main
